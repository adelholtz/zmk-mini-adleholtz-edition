# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Tighten BLE connection interval between keyboard halves (7.5ms)
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6

# Tighten BLE connection interval to host computer (7.5ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Increase BLE transmit buffer to prevent dropped keypresses
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_ACL_TX_SIZE=64

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_KEYBOARD_NAME="CorneMini"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y   

# 1000Hz USB polling when wired
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
